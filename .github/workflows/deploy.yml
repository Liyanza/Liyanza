# Déploiement du site sur AWS (EC2 « kiyanza-backend », eu-west-3).
# Voir docs/deploiement-aws.md.
#
# 1. Construit l'image Docker (Next.js standalone) et la pousse dans ECR,
#    étiquetée par le commit et par « prod ».
# 2. Par Session Manager, le serveur récupère « prod » et relance le conteneur
#    web (script deploy/aws/deploy-web.sh du dépôt Liyanza-backend).
#
# Aucune clé AWS dans GitHub : identifiants temporaires par OIDC, rôle
# github-deploy-web, limité à ce dépôt et à la branche main.

name: Deploy (AWS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  INSTANCE_ID: i-092ed836d43e8cec5
  PUBLIC_IP: 13.39.6.244
  ECR_REPOSITORY: 922640335967.dkr.ecr.eu-west-3.amazonaws.com/kiyanza-web

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922640335967:role/github-deploy-web
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY }}:prod
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.kiyanza.com' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.kiyanza.com' }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2
        run: |
          commands='["set -eu","sh /opt/kiyanza/backend/deploy/aws/deploy-web.sh"]'
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub web ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "{\"commands\":$commands,\"executionTimeout\":[\"600\"]}" \
            --query Command.CommandId --output text)
          echo "Commande SSM : $id"

          status=InProgress
          for _ in $(seq 1 40); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 80
          echo "Statut : $status"
          [ "$status" = Success ]

      # Tant que le DNS ne pointe pas vers l'EC2 (bascule depuis Vercel), la
      # vérification publique n'aurait pas de sens : on la saute.
      - name: Check public site
        run: |
          resolved=$(dig +short www.kiyanza.com A | tail -n 1)
          if [ "$resolved" != "$PUBLIC_IP" ]; then
            echo "::warning::www.kiyanza.com résout vers '$resolved', pas $PUBLIC_IP : vérification publique sautée."
            exit 0
          fi
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://www.kiyanza.com/robots.txt
          echo "https://www.kiyanza.com répond."
